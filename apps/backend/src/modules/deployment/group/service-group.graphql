enum ServiceGroupName {
  Admin
  Analyst
  Reader
  Manager
  Observer
  User
}

type ServiceGroup implements Node {
  id: ID!
  name: ServiceGroupName!
}

type UserPlatformGroup {
  platformIdentifier: PlatformIdentifier!
  name: ServiceGroupName!
}

type BundleUserServiceGroup {
  user: User!
  groups: [UserPlatformGroup!]!
}

input BundleUserRoleAssignmentInput {
  product: PlatformIdentifier!
  role: ServiceGroupName!
}

input AddUsersToBundleGroupsInput {
  userIds: [UserId!]!
  emails: [String!]
  roles: [BundleUserRoleAssignmentInput!]!
}

input UpdateBundleUserGroupsRoleInput {
  product: PlatformIdentifier!
  role: ServiceGroupName
}

input UpdateBundleUserGroupsInput {
  userIds: [UserId!]!
  roles: [UpdateBundleUserGroupsRoleInput!]!
}

type Query {
  bundleUserServiceGroups(
    serviceInstanceId: ServiceInstanceId!
  ): [BundleUserServiceGroup!]!
    @auth(
      portalCapa: [BYPASS]
      orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION]
    )
  bundleProducts(serviceInstanceId: ServiceInstanceId!): [PlatformIdentifier!]!
    @auth(
      portalCapa: [BYPASS]
      orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION]
    )
}

type Mutation {
  addUsersToBundleGroups(
    serviceInstanceId: ServiceInstanceId!
    input: AddUsersToBundleGroupsInput!
  ): [BundleUserServiceGroup!]!
    @auth(
      portalCapa: [BYPASS]
      orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION]
    )
  removeUsersFromBundleGroups(
    serviceInstanceId: ServiceInstanceId!
    userIds: [UserId!]!
  ): [UserId!]!
    @auth(
      portalCapa: [BYPASS]
      orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION]
    )
  updateBundleUserGroups(
    serviceInstanceId: ServiceInstanceId!
    input: UpdateBundleUserGroupsInput!
  ): [BundleUserServiceGroup!]!
    @auth(
      portalCapa: [BYPASS]
      orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION]
    )
}

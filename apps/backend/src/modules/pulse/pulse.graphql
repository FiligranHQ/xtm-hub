# Threat Pulse: privacy-preserving aggregation of OpenCTI contributions.
# Warning ! Used by OpenCTI (wire contract), keep every type and field stable.

enum PulseObjectType {
  indicator
  attack_pattern
  vulnerability
  intrusion_set
  malware
  tool
}

enum PulseEventKind {
  created
  sighted
  detected
  hunted
  referenced
}

enum PulseSectorBucket {
  finance
  government
  defense
  healthcare
  energy_utilities
  telecommunications
  technology
  manufacturing
  transportation
  retail_consumer
  education_research
  non_profit
  other
  undisclosed
}

enum PulseRegionBucket {
  africa
  asia_pacific
  europe
  latin_america
  middle_east
  north_america
  global
  undisclosed
}

enum PulsePeriod {
  last_7_days
  last_30_days
  last_90_days
}

enum PulsePrevalenceBucket {
  rare
  uncommon
  common
  widespread
}

enum PulseTrendDirection {
  rising
  stable
  falling
}

type PulseSalt {
  "UTC day, YYYY-MM-DD"
  day: String!
  "32 lowercase hex characters (16 random bytes, generated once per UTC day)"
  salt: String!
}

input PulseRecordInput {
  "AES-128-ECB of the stable key under the day's salt, ^[0-9a-f]{32}$"
  hash: String!
  object_type: PulseObjectType!
  event_kind: PulseEventKind!
  "1..100000"
  count: Int!
}

input PushPulseInput {
  "Random UUID the platform draws once per batch and sends again on every retry: a batch already recorded is answered with its first result and counted once"
  batch_id: String!
  "Salt day used for every hash of the batch (today or yesterday, UTC)"
  day: String!
  sector_bucket: PulseSectorBucket!
  region_bucket: PulseRegionBucket!
  "1..5000 records, (hash, object_type, event_kind) unique inside a batch"
  records: [PulseRecordInput!]!
}

type PushPulseResult {
  accepted: Int!
  day: String!
}

input PulseLookupInput {
  day: String!
  object_type: PulseObjectType!
  "1..1000 hashes under the day's salt"
  hashes: [String!]!
}

type PulseLookupResult {
  "Echo of the requested hash, same order as the request"
  hash: String!
  "Distinct platforms over the retention period >= k"
  published: Boolean!
  prevalence_bucket: PulsePrevalenceBucket
  "5-9, 10-24, 25-49, 50-99, 100-249 or 250+"
  platforms_bucket: String
  first_seen_network: String
  last_seen_network: String
  trend: PulseTrendDirection
  "12 weekly values, oldest first, never exact counts: each is the lower bound of the platforms range of its week (5, 10, 25, ...), 0 below k, and k for a week published as the <5 range"
  trend_series: [Int!]
  "Null unless the caller's sector bucket has at least k platforms on the key over 30 days"
  sector_trend: PulseTrendDirection
  sector_platforms_bucket: String
}

input PulseTrendingInput {
  day: String!
  period: PulsePeriod!
  "Null for the whole network"
  sector_bucket: PulseSectorBucket
  "Null for every region"
  region_bucket: PulseRegionBucket
  "Null for every object type"
  object_types: [PulseObjectType!]
  "Default 50, max 200"
  first: Int
}

type PulseTrendingItem {
  "Hash of the item under the requested day's salt"
  hash: String!
  object_type: PulseObjectType!
  platforms_bucket: String!
  prevalence_bucket: PulsePrevalenceBucket!
  trend: PulseTrendDirection!
  "(recent + 1) / (baseline + 1)"
  growth: Float!
  "First day one week of the history reached k platforms; null while no week did"
  first_seen_network: String
}

type PulseTrendingResult {
  day: String!
  period: PulsePeriod!
  sector_bucket: PulseSectorBucket
  region_bucket: PulseRegionBucket
  items: [PulseTrendingItem!]!
}

input PulseBenchmarkInput {
  "Must equal the XTM-Hub-Platform-Id header"
  platformId: String!
  day: String!
  period: PulsePeriod!
}

type PulseBenchmarkMetric {
  object_type: PulseObjectType!
  event_kind: PulseEventKind!
  "Events of the calling platform over the period, in every sector it reported under; compared with network_median"
  platform_count: Int!
  "Events of the calling platform over the period in its current sector only; compared with sector_median"
  sector_platform_count: Int!
  "Null when the sector bucket has fewer than k active platforms in the period"
  sector_median: Float
  "Null when the network has fewer than k active platforms in the period"
  network_median: Float
}

type PulseBenchmarkItem {
  hash: String!
  object_type: PulseObjectType!
  platform_count: Int!
  sector_median: Float!
  ratio: Float!
}

type PulseBenchmarkResult {
  period: PulsePeriod!
  sector_bucket: PulseSectorBucket!
  region_bucket: PulseRegionBucket!
  "Null when the sector bucket has fewer than k active platforms in the period"
  sector_platforms_bucket: String
  metrics: [PulseBenchmarkMetric!]!
  "At most 50 items"
  top_items: [PulseBenchmarkItem!]!
}

enum PulseContributionStatus {
  "The caller contributed within the contribution window"
  active
  "The caller contributed within the grace period, not within the window"
  grace
  "The caller's last contribution is older than the grace period"
  lapsed
  "The caller never contributed"
  none
}

type PulseStatus {
  day: String!
  k_threshold: Int!
  retention_months: Int!
  "Active contributors over 30 days: <k below the anonymity threshold, else a platforms bucket"
  contributors_bucket: String!
  "The caller can read lookups, trending and benchmarks (active or grace)"
  read_access: Boolean!
  last_contribution_day: String
  contribution_status: PulseContributionStatus!
  "Last day of read access without a new contribution"
  read_access_until: String
  contribution_window_days: Int!
  contribution_grace_days: Int!
}

input PulseDigestInput {
  "UTC day of the salt the digest hashes are computed with"
  day: String!
  "The network trending when absent"
  sector_bucket: PulseSectorBucket
  "The sector trending of every region when absent"
  region_bucket: PulseRegionBucket
}

type PulseDigestItem {
  "Transport hash under the salt of the digest day"
  hash: String!
  object_type: PulseObjectType!
  prevalence_bucket: PulsePrevalenceBucket!
  trend: PulseTrendDirection!
}

type PulseDigestTrendingItem {
  rank: Int!
  hash: String!
  object_type: PulseObjectType!
  prevalence_bucket: PulsePrevalenceBucket!
  trend: PulseTrendDirection!
}

type PulseDigestTrending {
  period: PulsePeriod!
  "The first ranks only"
  items: [PulseDigestTrendingItem!]!
  "Ranks after the named ones, up to 10, counted but not named"
  locked_count: Int!
}

type PulseDigest {
  day: String!
  sector_bucket: PulseSectorBucket
  region_bucket: PulseRegionBucket
  "The most prevalent published keys of the network, PULSE_DIGEST_SIZE at most"
  items: [PulseDigestItem!]!
  trending: PulseDigestTrending!
}

type PulsePurgeResult {
  success: Boolean!
  deleted_records: Int!
}

extend type Query {
  # Warning ! Used by OpenCTI
  pulseSalt(day: String!): PulseSalt! @platform_token
  # Warning ! Used by OpenCTI
  pulseStatus: PulseStatus! @platform_token
  # Warning ! Used by OpenCTI
  pulseDigest(input: PulseDigestInput!): PulseDigest! @platform_token
  # Warning ! Used by OpenCTI
  pulseLookup(input: PulseLookupInput!): [PulseLookupResult!]! @platform_token
  # Warning ! Used by OpenCTI
  pulseTrending(input: PulseTrendingInput!): PulseTrendingResult!
    @platform_token
  # Warning ! Used by OpenCTI
  pulseBenchmark(input: PulseBenchmarkInput!): PulseBenchmarkResult!
    @platform_token
}

extend type Mutation {
  # Warning ! Used by OpenCTI
  pushPulse(input: PushPulseInput!): PushPulseResult! @platform_token
  # Warning ! Used by OpenCTI
  pulsePurge(platformId: String!): PulsePurgeResult! @platform_token
}

# Monitoring of the network by the Hub administrators (Settings > Threat
# Pulse), not part of the OpenCTI wire contract: counts, types, buckets and
# days only, never a value, a transport hash or a platform pseudonym.

type PulseNetworkSettings {
  enabled: Boolean!
  "Why the service is disabled, null while it is enabled"
  disabled_reason: String
  "The settings are null when one of them is invalid"
  k_threshold: Int
  retention_months: Int
  "Days from the first day the retention keeps to today, both included"
  retention_days: Int
  digest_size: Int
  contribution_window_days: Int
  contribution_grace_days: Int
  trending_cache_ttl_minutes: Int
}

type PulseNetworkPlatformCounts {
  "Active OpenCTI registrations"
  registered: Int!
  "Platforms within the contribution window or the grace period. Null while the settings are invalid"
  contributing: Int
  "Platforms that pushed a batch over the last 24 hours"
  active_last_24_hours: Int!
  "Platforms whose last contribution day is one of the last 7 UTC days"
  active_last_7_days: Int!
  "Registered platforms with no contribution held: the preview only. Null while the service is disabled"
  preview_only: Int
  "Platforms whose last contribution is older than the grace period. Null while the settings are invalid"
  lapsed: Int
  "Contributors no active registration matches any more. Null while the service is disabled"
  unregistered: Int
  "Platforms that downloaded the preview digest over the last 24 hours"
  digest_readers_last_24_hours: Int!
}

type PulseNetworkKeyCounts {
  "Keys held over the retention period"
  tracked: Float!
  "Keys reported by at least k platforms: the only ones ever published"
  published: Float!
  "Keys reported by fewer than k platforms: never published"
  suppressed: Float!
}

type PulseNetworkIngestion {
  batches_today: Int!
  records_today: Float!
  batches_last_30_days: Int!
  records_last_30_days: Float!
}

type PulseNetworkActivityDay {
  day: String!
  batches: Int!
  records: Float!
  "Sum of the event counts of the day"
  events: Float!
  "Platforms that contributed to the day"
  platforms: Int!
}

type PulseNetworkSectorCoverage {
  sector_bucket: PulseSectorBucket!
  "Platforms whose current sector bucket it is"
  platforms: Int!
  "Events of the last 30 days"
  events: Float!
}

type PulseNetworkRegionCoverage {
  region_bucket: PulseRegionBucket!
  platforms: Int!
  events: Float!
}

type PulseNetworkKindCoverage {
  object_type: PulseObjectType!
  event_kind: PulseEventKind!
  "Platforms that reported it over the last 30 days"
  platforms: Int!
  events: Float!
}

enum PulseNetworkOperation {
  push_pulse
  pulse_lookup
  pulse_trending
  pulse_benchmark
  pulse_salt
  pulse_status
  pulse_digest
  pulse_purge
}

enum PulseNetworkRejectionCode {
  UNAUTHENTICATED
  FORBIDDEN
  BAD_USER_INPUT
  PULSE_CONTRIBUTION_REQUIRED
  PULSE_RATE_LIMITED
  PULSE_DISABLED
}

type PulseNetworkRejection {
  operation: PulseNetworkOperation!
  code: PulseNetworkRejectionCode!
  requests: Int!
  "Last UTC day with such a rejection"
  last_day: String!
}

type PulseNetworkOverview {
  "Current UTC day"
  day: String!
  settings: PulseNetworkSettings!
  platforms: PulseNetworkPlatformCounts!
  keys: PulseNetworkKeyCounts!
  ingestion: PulseNetworkIngestion!
  "The last 30 UTC days, the oldest first, every day present"
  activity: [PulseNetworkActivityDay!]!
  sectors: [PulseNetworkSectorCoverage!]!
  regions: [PulseNetworkRegionCoverage!]!
  "Object types and event kinds of the last 30 days"
  kinds: [PulseNetworkKindCoverage!]!
  "Requests refused over the last 7 UTC days"
  rejections: [PulseNetworkRejection!]!
  last_digest_at: Date
  last_trending_at: Date
}

type PulseNetworkTrendingItem {
  "The first characters of the at-rest key: an identifier, it reveals nothing about the object"
  key_id: String!
  object_type: PulseObjectType!
  platforms_bucket: String!
  prevalence_bucket: PulsePrevalenceBucket!
  trend: PulseTrendDirection!
  growth: Float!
  first_seen_network: String
}

type PulseNetworkTrending {
  day: String!
  period: PulsePeriod!
  "When the service computed the list it serves (cached for the trending TTL)"
  computed_at: Date
  items: [PulseNetworkTrendingItem!]!
}

enum PulseNetworkPlatformStatus {
  "Contributed within the contribution window or the grace period"
  contributing
  "The last contribution is older than the grace period"
  lapsed
  "No contribution held (never contributed, purged or expired): the preview only"
  preview_only
}

enum PulseNetworkPlatformOrdering {
  title
  organization_name
  status
  last_contribution_day
  records_last_30_days
  purge_requests
}

type PulseNetworkPlatform {
  "The service instance of the registration"
  id: ID!
  title: String!
  organization_name: String
  sector_bucket: PulseSectorBucket
  region_bucket: PulseRegionBucket
  status: PulseNetworkPlatformStatus!
  first_contribution_day: String
  last_contribution_day: String
  last_batch_at: Date
  batches_last_30_days: Int!
  records_last_30_days: Float!
  "Purges requested over the retention period"
  purge_requests: Int!
  last_purge_day: String
}

type PulseNetworkPlatformEdge {
  cursor: String!
  node: PulseNetworkPlatform!
}

type PulseNetworkPlatformConnection {
  totalCount: Int!
  edges: [PulseNetworkPlatformEdge!]!
  pageInfo: PageInfo!
}

extend type Query {
  pulseNetworkOverview: PulseNetworkOverview! @auth(portalCapa: [BYPASS])
  pulseNetworkTrending(period: PulsePeriod!, first: Int): PulseNetworkTrending!
    @auth(portalCapa: [BYPASS])
  pulseNetworkPlatforms(
    first: Int!
    after: ID
    orderBy: PulseNetworkPlatformOrdering!
    orderMode: OrderingMode!
    searchTerm: String
    status: PulseNetworkPlatformStatus
  ): PulseNetworkPlatformConnection! @auth(portalCapa: [BYPASS])
}

type UserServiceCapability implements Node {
  id: ID!
  user_service_id: ID!
  generic_service_capability: GenericServiceCapability
  subscription_capability: SubscriptionCapability
}

type SubscriptionCapability implements Node {
  id: ID!
  service_capability: ServiceCapability
}

type ServiceCapability implements Node {
  id: ID!
  name: String
  description: String
  service_definition_id: ID
}

input UserServicesAddCapabilitiesInput {
  userServiceIds: [UserServiceId!]!
  capabilities: [String]
}

type Mutation {
  AddCapabilitiesToUserServices(
    input: UserServicesAddCapabilitiesInput!
  ): [UserService]
  @service_capa(requires: [MANAGE_ACCESS])
  @auth(
  portalCapa: [BYPASS]
  orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_SUBSCRIPTION]
  )
}

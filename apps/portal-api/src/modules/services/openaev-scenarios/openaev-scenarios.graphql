type OpenAEVScenario implements Document & Node {
  id: ID!
  type: String!
  uploader: User
  uploader_organization: Organization
  name: String!
  short_description: String
  description: String
  file_name: String! @auth
  minio_name: String! @auth
  active: Boolean!
  created_at: Date!
  updated_at: Date
  updater_id: String @auth
  download_number: Int
  share_number: Int
  slug: String!
  use_cases: [UseCase!]
  service_instance_id: String! @auth
  service_instance: ServiceInstance @auth
  subscription: SubscriptionModel @auth
  children_documents: [ShareableResource!]
  # Specific fields for OpenAEVScenario scenarios
  product_version: String
}

type OpenAEVScenarioEdge {
  cursor: String!
  node: OpenAEVScenario!
}

type OpenAEVScenarioConnection {
  totalCount: Int!
  edges: [OpenAEVScenarioEdge!]!
  pageInfo: PageInfo!
}

type Query {
  seoOpenAEVScenariosByServiceSlug(serviceSlug: String): [OpenAEVScenario]
}

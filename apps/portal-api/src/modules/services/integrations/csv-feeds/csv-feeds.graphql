type CsvFeed implements Node & Document & Integration {
  # Node
  id: ID!

  # Document Base
  type: String!
  uploader: User
  uploader_organization: Organization
  name: String!
  short_description: String
  description: String
  file_name: String
  minio_name: String!
  active: Boolean!
  created_at: Date!
  updated_at: Date
  updater_id: String
  download_number: Int
  share_number: Int
  slug: String!
  labels: [Label!]
  service_instance_id: String!
  service_instance: ServiceInstance
  subscription: SubscriptionModel
  children_documents: [ShareableResource!]

  # Integrations
  remover_id: ID
  integration_type: IntegrationType!
}

input CreateCsvFeedInput {
  name: String!
  slug: String!
  uploader_id: String!
  short_description: String!
  description: String!
  active: Boolean!
  labels: [String!]
}

input UpdateCsvFeedInput {
  name: String
  slug: String
  short_description: String
  description: String
  active: Boolean
  labels: [String!]
  uploader_organization_id: String
  uploader_id: String
}

type Mutation {
  createCsvFeed(
    input: CreateCsvFeedInput!
    document: [Upload!]
    serviceInstanceId: String!
  ): CsvFeed! @auth @service_capa(requires: [UPLOAD])
  updateCsvFeed(
    documentId: ID!
    input: UpdateCsvFeedInput!
    document: [Upload!]
    updateDocument: Boolean!
    images: [String!]
    serviceInstanceId: String
  ): CsvFeed! @auth @service_capa(requires: [UPLOAD])
  deleteCsvFeed(id: ID!, serviceInstanceId: String!): CsvFeed!
    @auth
    @service_capa(requires: [DELETE])
}

enum IntegrationType {
  csv_feed
  connector
  rss_feed
  json_feed
  taxii_feed
  stream
  third_party_integration
}

enum IntegrationSubType {
  EXTERNAL_IMPORT
  INTERNAL_ENRICHMENT
  INTERNAL_EXPORT_FILE
  INTERNAL_IMPORT_FILE
  STREAM
  NATIVE
  ORCHESTRATION
  DETECTION
  CASE_MANAGEMENT
}

interface Integration implements Node & Document {
  # Node
  id: ID!

  # Document
  type: String!
  uploader: User
  uploader_organization: Organization
  name: String!
  short_description: String
  description: String
  file_name: String
  minio_name: String!
  active: Boolean!
  created_at: Date!
  updated_at: Date
  updater_id: String
  download_number: Int
  share_number: Int
  slug: String!
  labels: [Label!]
  service_instance_id: String!
  service_instance: ServiceInstance
  subscription: SubscriptionModel
  children_documents: [ShareableResource!]

  # Integration
  remover_id: ID
  integration_type: IntegrationType!
}

# Strictly equal to Integration. Otherwise we have typing issues because no type overlaps
type IntegrationHack implements Node & Document & Integration {
  # Node
  id: ID!

  # Document
  type: String!
  uploader: User
  uploader_organization: Organization @auth
  name: String!
  short_description: String
  description: String
  file_name: String @auth
  minio_name: String! @auth
  active: Boolean!
  created_at: Date!
  updated_at: Date
  updater_id: String @auth
  download_number: Int
  share_number: Int
  slug: String!
  labels: [Label!]
  service_instance_id: String!
  service_instance: ServiceInstance
  subscription: SubscriptionModel @auth
  children_documents: [ShareableResource!]

  # Integration
  remover_id: ID
  integration_type: IntegrationType!
}


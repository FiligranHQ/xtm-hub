type IntegrationEdge {
  cursor: String!
  node: Integration!
}

type IntegrationConnection {
  totalCount: Int!
  edges: [IntegrationEdge!]!
  pageInfo: PageInfo!
}

type Query {
  integrations(
    first: Int!
    after: ID
    orderBy: DocumentOrdering!
    orderMode: OrderingMode!
    searchTerm: String
    logicalFilters: LogicalFilterInput
    serviceInstanceId: String
  ): IntegrationConnection! @auth
  integration(id: ID, serviceInstanceId: ID): Integration @auth
  publicIntegrations(
    slug: String!
    first: Int!
    after: ID
    orderBy: DocumentOrdering!
    orderMode: OrderingMode!
    searchTerm: String
    logicalFilters: LogicalFilterInput
    serviceInstanceId: String
  ): IntegrationConnection!
  publicIntegrationsByServiceSlug(serviceSlug: String): [Integration]
  publicIntegrationBySlug(slug: String): Integration
}

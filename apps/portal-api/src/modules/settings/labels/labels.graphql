type Label implements Node {
  id: ID!
  name: String!
  color: String!
}

enum LabelOrdering {
  name
  color
}

type LabelEdge {
  cursor: String!
  node: Label!
}

type LabelConnection {
  totalCount: Int!
  edges: [LabelEdge!]!
  pageInfo: PageInfo!
}

input AddLabelInput {
  name: String!
  color: String!
}

input EditLabelInput {
  name: String
  color: String
}

type Query {
  labels(
    first: Int!
    after: ID
    orderBy: LabelOrdering!
    orderMode: OrderingMode!
    searchTerm: String
    documentType: String
  ): LabelConnection
  label(id: ID!): Label @auth
}

type Mutation {
  addLabel(input: AddLabelInput!): Label! @auth(portalCapa: [BYPASS])
  editLabel(id: ID!, input: EditLabelInput!): Label! @auth(portalCapa: [BYPASS])
  deleteLabel(id: ID!): Label! @auth(portalCapa: [BYPASS])
}

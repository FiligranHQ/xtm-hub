enum FiligranProduct {
  opencti
  openaev
  opengrc
  xtmone
  xtmhub
}
enum Timeline {
  now
  next
  under_consideration
  finished
}

enum EpicType {
  other
  integration
}

type Epic implements Node {
  id: ID!
  epic: String!
  title: String!
  short_description: String!
  description: String!
  active: Boolean!
  product: FiligranProduct!
  timeline: Timeline!
  epic_type: EpicType!
  document: Document
  document_id: ID
  uploader_id: String!
  updater_id: String
  created_at: Date!
  updated_at: Date
}

input CreateEpicInput {
  epic: String!
  title: String!
  short_description: String!
  description: String!
  active: Boolean
  product: FiligranProduct!
  timeline: Timeline!
  is_integration: Boolean
  illustration_document: Upload
}

input UpdateEpicInput {
  epic: String
  title: String
  short_description: String
  description: String
  active: Boolean
  product: FiligranProduct
  timeline: Timeline
  is_integration: Boolean
  illustration_document: Upload
}

type EpicEdge {
  cursor: String!
  node: Epic!
}
type EpicConnection {
  totalCount: Int!
  edges: [EpicEdge!]!
  pageInfo: PageInfo!
}
enum EpicOrdering {
  epic
}
type Query {
  epics(
    first: Int!
    after: ID
    orderBy: EpicOrdering!
    orderMode: OrderingMode!
    searchTerm: String
  ): EpicConnection
}

type Mutation {
  createEpic(input: CreateEpicInput!, document: [Upload!]): Epic!
    @auth
    @service_capa(requires: [UPSERT])
  updateEpic(id: ID!, input: UpdateEpicInput!, document: [Upload!]): Epic!
    @auth
    @service_capa(requires: [UPSERT])
  deleteEpic(id: ID!): Epic! @auth @service_capa(requires: [DELETE])
}

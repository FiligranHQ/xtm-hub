scalar JSON
scalar Date
scalar Upload

enum FilterKey {
  label
  organization_id
  personal_space
  integration_type
  integration_subtype
  slug
  product_version
  manager_supported
  feed_url,
  verified
}

enum LogicalOperator {
  AND
  OR
}

input Filter {
  key: FilterKey
  value: [String!]!
}

input LogicalFilterInput {
  leaf: Filter
  operator: LogicalOperator
  children: [LogicalFilterInput!]
}

type Success {
  success: Boolean!
}

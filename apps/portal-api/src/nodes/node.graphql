directive @system_token repeatable on OBJECT | FIELD_DEFINITION

directive @platform_token repeatable on OBJECT | FIELD_DEFINITION

directive @id(type: String!) on FIELD_DEFINITION | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

directive @auth(
  portalCapa: [PortalCapability] = []
  orgaCapa: [OrganizationCapability] = []
) repeatable on OBJECT | FIELD_DEFINITION

enum PortalCapability {
  BYPASS
  READ_TRIALS
  MODIFY_TRIALS
  MODIFY_TRIALS_QUOTA
  MODIFY_COMPETITORS
}

enum OrganizationCapability {
  ADMINISTRATE_ORGANIZATION
  MANAGE_ACCESS
  MANAGE_SUBSCRIPTION
  MANAGE_PLATFORM_REGISTRATION
}

directive @service_capa(
  requires: [ServiceRestriction] = []
) repeatable on OBJECT | FIELD_DEFINITION

enum ServiceRestriction {
  ACCESS_USER
  MANAGE_ACCESS
  UPLOAD
  DELETE
  UPSERT
}

interface Node {
  id: ID!
}

enum OrderingMode {
  asc
  desc
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type MergeEvent implements Node {
  id: ID!
  from: ID!
  target: ID!
}

type Query {
  node(id: ID!): Node @auth
}

query MostDeployedDocumentsQuery($limit: Int!, $platformIdentifiers: [PlatformIdentifier!]) {
  mostDeployedDocuments(limit: $limit, platformIdentifiers: $platformIdentifiers) {
    id
    name
    short_description
    type
    active
    slug
    service_instance_id
    children_documents {
      id
      image_type
    }
    use_cases {
      id
      name
    }
    ... on Connector {
      verified
      manager_supported
    }
  }
}

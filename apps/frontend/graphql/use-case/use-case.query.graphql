fragment UseCaseRow on UseCase {
  id
  name
  color
  product
}

query UseCasesList(
  $count: Int!
  $orderBy: UseCaseOrdering!
  $orderMode: OrderingMode!
  $documentType: String
  $product: FiligranProduct
) {
  useCases(
    first: $count
    orderBy: $orderBy
    orderMode: $orderMode
    documentType: $documentType
    product: $product
  ) {
    totalCount
    edges {
      node {
        id
        name
        color
        product
      }
    }
  }
}

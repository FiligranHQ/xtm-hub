fragment UseCaseRow on UseCase {
  id
  name
  color
}

query UseCasesList(
  $count: Int!
  $orderBy: UseCaseOrdering!
  $orderMode: OrderingMode!
  $documentType: String
) {
  useCases(
    first: $count
    orderBy: $orderBy
    orderMode: $orderMode
    documentType: $documentType
  ) {
    totalCount
    edges {
      node {
        id
        name
        color
      }
    }
  }
}

fragment VotableFeatureAdminRow on VotableFeature {
  id
  voting_round_id
  title
  short_description
  description
  product
  labels
  image_url
  position
  active
}

fragment VotingRoundRow on VotingRound {
  id
  name
  description
  status
  opened_at
  closed_at
  created_at
  features {
    ...VotableFeatureAdminRow
  }
}

query VotingRoundsList {
  votingRounds {
    ...VotingRoundRow
  }
}

query VotingRoundDetail($id: VotingRoundId!) {
  votingRound(id: $id) {
    ...VotingRoundRow
  }
}

query VotingRoundRanking($id: VotingRoundId!) {
  votingRoundResults(id: $id) {
    total_voters
    round {
      id
      name
      status
    }
    results {
      vote_count
      feature {
        ...VotableFeatureAdminRow
      }
    }
  }
}

query ThreatPulseOverview {
  pulseNetworkOverview {
    day
    settings {
      enabled
      disabled_reason
      k_threshold
      retention_months
      retention_days
      digest_size
      contribution_window_days
      contribution_grace_days
      trending_cache_ttl_minutes
    }
    platforms {
      registered
      contributing
      active_last_24_hours
      active_last_7_days
      preview_only
      lapsed
      unregistered
      digest_readers_last_24_hours
    }
    keys {
      tracked
      published
      suppressed
    }
    ingestion {
      batches_today
      records_today
      batches_last_30_days
      records_last_30_days
    }
    activity {
      day
      batches
      records
      events
      platforms
    }
    sectors {
      sector_bucket
      platforms
      events
    }
    regions {
      region_bucket
      platforms
      events
    }
    kinds {
      object_type
      event_kind
      platforms
      events
    }
    rejections {
      operation
      code
      requests
      last_day
    }
    last_digest_at
    last_trending_at
  }
}

query ThreatPulseTrending($period: PulsePeriod!, $first: Int) {
  pulseNetworkTrending(period: $period, first: $first) {
    day
    period
    computed_at
    items {
      key_id
      object_type
      platforms_bucket
      prevalence_bucket
      trend
      growth
      first_seen_network
    }
  }
}

fragment ThreatPulsePlatformRow on PulseNetworkPlatform {
  id
  title
  organization_name
  sector_bucket
  region_bucket
  status
  first_contribution_day
  last_contribution_day
  last_batch_at
  batches_last_30_days
  records_last_30_days
  purge_requests
  last_purge_day
}

query ThreatPulsePlatforms(
  $count: Int!
  $cursor: ID
  $orderBy: PulseNetworkPlatformOrdering!
  $orderMode: OrderingMode!
  $searchTerm: String
  $status: PulseNetworkPlatformStatus
) {
  pulseNetworkPlatforms(
    first: $count
    after: $cursor
    orderBy: $orderBy
    orderMode: $orderMode
    searchTerm: $searchTerm
    status: $status
  ) {
    totalCount
    edges {
      node {
        ...ThreatPulsePlatformRow
      }
    }
  }
}

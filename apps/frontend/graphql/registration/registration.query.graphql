query RegisteredPlatforms($input: RegisteredPlatformsInput!) {
  registeredPlatforms(input: $input) {
    id
    identifier
    title
    contract
    deployment_request {
      id
      hub_status
      request_date
      start_date
      end_date
    }
    subscription {
      start_date
      end_date
      service_instance {
        id
      }
    }
  }
}

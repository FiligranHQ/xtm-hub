query ActiveXtmPlatformBundle($serviceInstanceId: ServiceInstanceId) {
  activeXtmPlatformBundle(serviceInstanceId: $serviceInstanceId) {
    id
    service_instance_id
    organization_name
    start_date
    end_date
    license
    requester_email
    products {
      platform_identifier
      service_instance_id
      name
      connectivity_status
      last_connectivity_check
      url
      roles {
        id
        name
      }
    }
  }
}

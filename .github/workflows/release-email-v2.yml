name: Send Release Email (Microft Graph)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Get Last Release
        id: last_release
        uses: actions/github-script@v8
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.setOutput("release_name", release.name || "");
            core.setOutput("release_tag", release.tag_name || "");
            core.setOutput("release_body", release.body || "");
            core.setOutput("release_url", release.html_url || "");

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Microsoft Graph token
        id: graph_token
        run: |
          TOKEN=$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Send Email via Microsoft Graph
        shell: bash
        env:
          GRAPH_TOKEN: ${{ steps.graph_token.outputs.token }}
          RELEASE_TAG: ${{ steps.last_release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.last_release.outputs.release_url }}
          RELEASE_BODY: ${{ steps.last_release.outputs.release_body }}
          MAIL_SENDER_UPN: ${{ vars.MAIL_SENDER_UPN }}
          MAIL_RECEIVER_UPN: ${{ vars.MAIL_RECEIVER_UPN }}
        run: |
          python - <<'PY'
          import json
          import html
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GRAPH_TOKEN"]
          release_tag = os.environ.get("RELEASE_TAG", "")
          release_url = os.environ.get("RELEASE_URL", "")
          release_body = os.environ.get("RELEASE_BODY", "")

          safe_release_body = html.escape(release_body).replace("\n", "<br/>")

          html_body = f"""🔔 DING DING 🔔<br/><br/>
          Dear Filigran team,<br/><br/>
          The Engineering team is glad to inform you that <a href=\"{release_url}\" target=\"_blank\">XTM Hub {release_tag}</a> has been released 🥳!<br/><br/>
          <h2>Release Note</h2>
          {safe_release_body}
          <br/><br/>
          Feel free to reach out to the <a href=\"mailto:engineering-product-management@filigran.io\">product management team</a> to get more information 🚀<br/><br/>
          Thank you all for your efforts in serving our community and our customers 🎀
          """

          payload = {
            "message": {
              "subject": f"[XTM Hub] Version: {release_tag}",
              "body": {
                "contentType": "HTML",
                "content": html_body,
              },
              "toRecipients": [
                {"emailAddress": {"address": os.environ["MAIL_RECEIVER_UPN"]}},
              ],
            },
            "saveToSentItems": True,
          }

          sender_upn = os.environ["MAIL_SENDER_UPN"]
          req = urllib.request.Request(
            url=f"https://graph.microsoft.com/v1.0/users/{sender_upn}/sendMail",
            data=json.dumps(payload).encode("utf-8"),
            method="POST",
            headers={
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
            },
          )

          try:
            with urllib.request.urlopen(req) as response:
              print(f"Graph sendMail status: {response.status}")
          except urllib.error.HTTPError as error:
            body = error.read().decode("utf-8", errors="replace")
            print(f"HTTPError: {error.code} {error.reason}")
            print(body)
            raise
          PY

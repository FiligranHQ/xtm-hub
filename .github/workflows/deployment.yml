name: Create Deployment

on:
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump the MAJOR version number"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout and pull development branch
        run: |
          git checkout development
          git pull origin development

      - name: Checkout and pull main branch
        run: |
          git checkout main
          git pull origin main

      - name: Merge development into main
        run: |
          git merge development -m "chore(release): prepare release"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: "yarn"
          cache-dependency-path: |
            yarn.lock

      - name: Verify directories exist
        run: |
          if [ ! -d "./apps/backend" ] || [ ! -d "./apps/frontend" ]; then
            echo "Error: apps/backend or apps/frontend directory does not exist"
            exit 1
          fi

      - name: Install dependencies
        working-directory: .
        run: |
          yarn install

      - name: Compute new version (MAJOR.YYMMDD.SEQ)
        run: |
          CURRENT_VERSION=$(node -p "require('./apps/backend/package.json').version")
          CURRENT_MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)

          if [ "${{ github.event.inputs.bump_major }}" == "true" ]; then
            MAJOR=$((CURRENT_MAJOR + 1))
          else
            MAJOR=$CURRENT_MAJOR
          fi

          YYMMDD=$(date -u +%y%m%d)

          SEQ=0
          for tag in $(git tag -l "v${MAJOR}.${YYMMDD}.*"); do
            TAG_SEQ=$(echo "$tag" | cut -d. -f3)
            if [ "$TAG_SEQ" -ge "$SEQ" ]; then
              SEQ=$((TAG_SEQ + 1))
            fi
          done

          NEW_VERSION="${MAJOR}.${YYMMDD}.${SEQ}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "✅ Computed version: $NEW_VERSION"

      - name: Set version in backend
        working-directory: ./apps/backend
        run: yarn version "${{ env.NEW_VERSION }}"

      - name: Set version in frontend
        working-directory: ./apps/frontend
        run: yarn version "${{ env.NEW_VERSION }}"

      - name: Commit and tag changes
        run: |
          git add package.json yarn.lock apps/backend/package.json apps/frontend/package.json
          git commit -m "chore(release): bump version to ${{ env.NEW_VERSION }}"
          git tag "v${{ env.NEW_VERSION }}"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Trigger Docker Build Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering dockerbuild-ci workflow..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/dockerbuild-ci.yml/dispatches \
            -d '{"ref":"v${{ env.NEW_VERSION }}"}'
          echo "✅ Docker build workflow triggered successfully"

      - name: Send n8n Webhook Notification
        run: |
          echo "Sending n8n webhook notification..."
          response=$(curl -X POST \
            -w "\n%{http_code}" \
            -o /tmp/webhook_response.txt \
            "${{ secrets.N8N_NOTIF_DEPLOYMENT_WEBHOOK }}?version=v${{ env.NEW_VERSION }}&status=requested")
          
          http_code=$(echo "$response" | tail -n1)
          response_body=$(cat /tmp/webhook_response.txt)
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Webhook notification sent successfully (HTTP $http_code)"
            echo "Response: $response_body"
          else
            echo "⚠️ Webhook notification failed (HTTP $http_code)"
            echo "Response: $response_body"
            # Optionally fail the workflow if webhook is critical
            # exit 1
          fi

      - name: Summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** v${{ env.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Major Bumped:** ${{ github.event.inputs.bump_major }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** MAJOR.YYMMDD.SEQ" >> $GITHUB_STEP_SUMMARY
          echo "- **Components Updated:** apps/backend, apps/frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created:** v${{ env.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Workflow:** Triggered automatically" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment has been successfully created and the Docker build workflow has been triggered." >> $GITHUB_STEP_SUMMARY

name: PR conventions checks

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

jobs:
  check-pr-title-convention:
    name: Check that PR title follows convention
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'renovate[bot]' && !startsWith(github.event.pull_request.title, '[Snyk]')
    permissions:
      contents: read
    steps:
      - uses: Slashgear/action-check-pr-title@76166c63ec0b25cdbe693e5e972e83ca186313fb
        with:
          regexp: '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+ \(#[0-9]+\)$'
          helpMessage: |
            PR title must follow Conventional Commits: 'type(scope?): description (#issuenumber)'

            Types : feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert
            Scope : optional, lowercase (e.g. frontend, backend) - bracket prefixes are discontinued

            Examples:
              feat(frontend): add card component (#123)
              fix(backend): handle missing auth token (#456)
              chore(ci): update docker base image (#101)

name: Notify Teams - Environment Ready
on:
  workflow_dispatch:
    inputs:
      node_id:
        description: 'Node ID'
        required: true
        type: string
jobs:
  notify-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.FILIGRANHQ_PROJECT_APP_ID }}
          private-key: ${{ secrets.FILIGRANHQ_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Get Issue Information
        id: get-info
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const nodeId = '${{ github.event.inputs.node_id }}';
            
            const query = `
              query GetInfo($nodeId: ID!) {
                node(id: $nodeId) {
                  __typename
                  ... on Issue {
                    url
                    title
                    number
                    projectItems(first: 10) {
                      nodes {
                        fieldValues(first: 50) {
                          nodes {
                            __typename
                            ... on ProjectV2ItemFieldTextValue {
                              text
                              field {
                                ... on ProjectV2Field {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        url
                        title
                        number
                      }
                    }
                    fieldValues(first: 20) {
                      nodes {
                        __typename
                        ... on ProjectV2ItemFieldTextValue {
                          text
                          field {
                            ... on ProjectV2Field {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            try {
              const result = await github.graphql(query, { nodeId });
            
              if (!result.node) {
                core.setFailed(`No node found with ID: ${nodeId}`);
                return;
              }
            
              let issueUrl = '';
              let issueTitle = '';
              let issueNumber = '';
              let featureEnv = '';
              let definitionPage = '';
            
              const node = result.node;
              const nodeType = node.__typename;
            
              // Helper function to check field name case-insensitively
              const isFeatureEnvField = (fieldName) => {
                return fieldName && fieldName.toLowerCase() === 'feature env';
              };
            
              // Helper function to check Definition page field case-insensitively
              const isDefinitionPageField = (fieldName) => {
                return fieldName && fieldName.toLowerCase() === 'definition page';
              };
            
              // Handle Issue directly
              if (nodeType === 'Issue') {
                issueUrl = node.url;
                issueTitle = node.title || '';
                issueNumber = node.number || '';
            
                // Look for Feature env and Definition page in project items (case-insensitive)
                if (node.projectItems && node.projectItems.nodes) {
                  for (const projectItem of node.projectItems.nodes) {
                    if (projectItem.fieldValues && projectItem.fieldValues.nodes) {
                      for (const field of projectItem.fieldValues.nodes) {
                        if (field.field) {
                          if (isFeatureEnvField(field.field.name)) {
                            featureEnv = field.text || '';
                            console.log(`Found field "${field.field.name}" with value: ${featureEnv}`);
                          }
                          if (isDefinitionPageField(field.field.name)) {
                            definitionPage = field.text || '';
                            console.log(`Found field "${field.field.name}" with value: ${definitionPage}`);
                          }
                        }
                      }
                    }
                  }
                }
              } 
              // Handle ProjectV2Item
              else if (nodeType === 'ProjectV2Item') {
                if (node.content) {
                  issueUrl = node.content.url || '';
                  issueTitle = node.content.title || '';
                  issueNumber = node.content.number || '';
                }
            
                // Look for Feature env and Definition page in field values (case-insensitive)
                if (node.fieldValues && node.fieldValues.nodes) {
                  for (const field of node.fieldValues.nodes) {
                    if (field.field) {
                      if (isFeatureEnvField(field.field.name)) {
                        featureEnv = field.text || '';
                        console.log(`Found field "${field.field.name}" with value: ${featureEnv}`);
                      }
                      if (isDefinitionPageField(field.field.name)) {
                        definitionPage = field.text || '';
                        console.log(`Found field "${field.field.name}" with value: ${definitionPage}`);
                      }
                    }
                  }
                }
              }
            
              // Extract domain from feature env URL for subtitle
              let featureEnvDomain = '';
              if (featureEnv) {
                try {
                  const urlObj = new URL(featureEnv);
                  featureEnvDomain = urlObj.hostname;
                } catch (e) {
                  // If it's not a valid URL, use as is
                  featureEnvDomain = featureEnv;
                }
              }
            
              // Extract PR number from feature env URL
              let prNumber = '';
              let prUrl = '';
              if (featureEnv) {
                // Match pattern: dev-pr-{number}.hub or dev-pr-{number}-something.hub
                const prMatch = featureEnv.match(/dev-pr-(\d+)[.-]/);
                if (prMatch && prMatch[1]) {
                  prNumber = prMatch[1];
                  // Construct PR URL based on repository
                  prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`;
                  console.log(`Extracted PR number: ${prNumber}`);
                  console.log(`PR URL: ${prUrl}`);
                }
              }
            
              console.log('='.repeat(50));
              console.log('📋 EXTRACTED INFORMATION');
              console.log('='.repeat(50));
              console.log(`Issue URL: ${issueUrl}`);
              console.log(`Title: ${issueTitle}`);
              console.log(`Issue Number: #${issueNumber}`);
              console.log(`Feature env: ${featureEnv || 'Not found'}`);
              console.log(`Feature env domain: ${featureEnvDomain || 'Not found'}`);
              console.log(`Definition page: ${definitionPage || 'Not found'}`);
              console.log(`PR Number: ${prNumber || 'Not found'}`);
              console.log(`PR URL: ${prUrl || 'Not found'}`);
            
              // Set outputs
              core.setOutput('issue_url', issueUrl);
              core.setOutput('issue_title', issueTitle);
              core.setOutput('issue_number', issueNumber);
              core.setOutput('feature_env', featureEnv);
              core.setOutput('feature_env_domain', featureEnvDomain);
              core.setOutput('definition_page', definitionPage);
              core.setOutput('pr_number', prNumber);
              core.setOutput('pr_url', prUrl);
            
              // Validate required fields
              if (!issueUrl) {
                core.warning('No Issue URL found');
              }
              if (!featureEnv) {
                core.warning('No Feature env value found');
              }
              if (!definitionPage) {
                core.warning('No Definition page value found');
              }
              if (!prNumber) {
                core.warning('Could not extract PR number from Feature env URL');
              }
            
            } catch (error) {
              core.setFailed(`Error fetching information: ${error.message}`);
              console.error('Full error:', error);
            }
      - name: Send to Microsoft Teams
        if: success()
        run: |
          WEBHOOK_URL="${{ secrets.TEAMS_WEBHOOK_PRODUCT_TESTING_URL }}"
          
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ No Teams webhook URL found in secrets"
            exit 1
          fi
          
          # Get outputs from previous step
          ISSUE_URL="${{ steps.get-info.outputs.issue_url }}"
          ISSUE_TITLE="${{ steps.get-info.outputs.issue_title }}"
          ISSUE_NUMBER="${{ steps.get-info.outputs.issue_number }}"
          FEATURE_ENV="${{ steps.get-info.outputs.feature_env }}"
          FEATURE_ENV_DOMAIN="${{ steps.get-info.outputs.feature_env_domain }}"
          DEFINITION_PAGE="${{ steps.get-info.outputs.definition_page }}"
          PR_NUMBER="${{ steps.get-info.outputs.pr_number }}"
          PR_URL="${{ steps.get-info.outputs.pr_url }}"
          
          # Build facts array dynamically
          FACTS='['
          
          # Add Feature env - show N/A if empty
          if [ -n "$FEATURE_ENV" ]; then
            FACTS="${FACTS}{\"name\":\"Feature env\",\"value\":\"[${FEATURE_ENV}](${FEATURE_ENV})\"}"
          else
            FACTS="${FACTS}{\"name\":\"Feature env\",\"value\":\"N/A\"}"
          fi
          
          # Add Definition page - show N/A if empty
          if [ -n "$DEFINITION_PAGE" ]; then
            FACTS="${FACTS},{\"name\":\"Definition page\",\"value\":\"[${DEFINITION_PAGE}](${DEFINITION_PAGE})\"}"
          else
            FACTS="${FACTS},{\"name\":\"Definition page\",\"value\":\"N/A\"}"
          fi
          
          # Add PR link if available
          if [ -n "$PR_NUMBER" ] && [ -n "$PR_URL" ]; then
            FACTS="${FACTS},{\"name\":\"GitHub PR\",\"value\":\"[Pull Request #${PR_NUMBER}](${PR_URL})\"}"
          fi
          
          # Always add Issue link
          FACTS="${FACTS},{\"name\":\"GitHub Issue\",\"value\":\"[Issue #${ISSUE_NUMBER}](${ISSUE_URL})\"}"
          FACTS="${FACTS}]"
          
          # Set subtitle - use "N/A" if no feature env domain
          if [ -n "$FEATURE_ENV_DOMAIN" ]; then
            SUBTITLE="$FEATURE_ENV_DOMAIN"
          else
            SUBTITLE="Environment information not available"
          fi
          
          # Create Teams message
          cat > teams-message.json << EOF
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "00B894",
            "summary": "${ISSUE_TITLE} - Ready for Testing",
            "title": "🚀 ${ISSUE_TITLE}",
            "sections": [{
              "activityTitle": "Environment Ready for Testing",
              "text": "The feature environment is now deployed and ready for testing.",
              "facts": ${FACTS},
              "markdown": true
            }]
          }
          EOF
          
          # Send to Teams
          HTTP_RESPONSE=$(curl -H "Content-Type: application/json" \
            -X POST "$WEBHOOK_URL" \
            -d @teams-message.json \
            -s -o /dev/null -w "%{http_code}")
          
          if [ "$HTTP_RESPONSE" -eq "200" ] || [ "$HTTP_RESPONSE" -eq "1" ]; then
            echo "✅ Teams notification sent successfully"
          else
            echo "❌ Failed to send Teams notification (HTTP $HTTP_RESPONSE)"
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          echo "## 📊 Notification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.get-info.outputs.issue_url }}" != "" ]; then
            echo "✅ **Successfully extracted information:**" >> $GITHUB_STEP_SUMMARY
            echo "- Title: ${{ steps.get-info.outputs.issue_title }}" >> $GITHUB_STEP_SUMMARY
            echo "- Issue Number: #${{ steps.get-info.outputs.issue_number }}" >> $GITHUB_STEP_SUMMARY
          
            if [ "${{ steps.get-info.outputs.feature_env }}" != "" ]; then
              echo "- Feature Environment: ${{ steps.get-info.outputs.feature_env }}" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Feature Environment: N/A" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ steps.get-info.outputs.pr_number }}" != "" ]; then
              echo "- Pull Request: #${{ steps.get-info.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ steps.get-info.outputs.definition_page }}" != "" ]; then
              echo "- Definition Page: ${{ steps.get-info.outputs.definition_page }}" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Definition Page: N/A" >> $GITHUB_STEP_SUMMARY
            fi
          
            
          
            echo "- Teams notification sent" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Failed to extract information from node ID**" >> $GITHUB_STEP_SUMMARY
          fi

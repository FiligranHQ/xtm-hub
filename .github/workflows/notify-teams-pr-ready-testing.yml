name: Notify Teams - Environment Ready

on:
  workflow_dispatch:
    inputs:
      node_id:
        description: 'Node ID'
        required: true
        type: string

jobs:
  notify-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.FILIGRANHQ_PROJECT_APP_ID }}
          private-key: ${{ secrets.FILIGRANHQ_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get Issue Information
        id: get-info
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const nodeId = '${{ github.event.inputs.node_id }}';
            
            const query = `
              query GetInfo($nodeId: ID!) {
                node(id: $nodeId) {
                  __typename
                  ... on Issue {
                    url
                    title
                    number
                    projectItems(first: 10) {
                      nodes {
                        fieldValues(first: 20) {
                          nodes {
                            __typename
                            ... on ProjectV2ItemFieldTextValue {
                              text
                              field {
                                ... on ProjectV2Field {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        url
                        title
                        number
                      }
                    }
                    fieldValues(first: 20) {
                      nodes {
                        __typename
                        ... on ProjectV2ItemFieldTextValue {
                          text
                          field {
                            ... on ProjectV2Field {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            try {
              const result = await github.graphql(query, { nodeId });
            
              if (!result.node) {
                core.setFailed(`No node found with ID: ${nodeId}`);
                return;
              }
            
              let issueUrl = '';
              let issueTitle = '';
              let issueNumber = '';
              let featureEnv = '';
            
              const node = result.node;
              const nodeType = node.__typename;
            
              // Helper function to check field name case-insensitively
              const isFeatureEnvField = (fieldName) => {
                return fieldName && fieldName.toLowerCase() === 'feature env';
              };
            
              // Handle Issue directly
              if (nodeType === 'Issue') {
                issueUrl = node.url;
                issueTitle = node.title || '';
                issueNumber = node.number || '';
            
                // Look for Feature env in project items (case-insensitive)
                if (node.projectItems && node.projectItems.nodes) {
                  for (const projectItem of node.projectItems.nodes) {
                    if (projectItem.fieldValues && projectItem.fieldValues.nodes) {
                      for (const field of projectItem.fieldValues.nodes) {
                        if (field.field && isFeatureEnvField(field.field.name)) {
                          featureEnv = field.text || '';
                          console.log(`Found field "${field.field.name}" with value: ${featureEnv}`);
                          break;
                        }
                      }
                    }
                    if (featureEnv) break;
                  }
                }
              } 
              // Handle ProjectV2Item
              else if (nodeType === 'ProjectV2Item') {
                if (node.content) {
                  issueUrl = node.content.url || '';
                  issueTitle = node.content.title || '';
                  issueNumber = node.content.number || '';
                }
            
                // Look for Feature env in field values (case-insensitive)
                if (node.fieldValues && node.fieldValues.nodes) {
                  for (const field of node.fieldValues.nodes) {
                    if (field.field && isFeatureEnvField(field.field.name)) {
                      featureEnv = field.text || '';
                      console.log(`Found field "${field.field.name}" with value: ${featureEnv}`);
                      break;
                    }
                  }
                }
              }
            
              // Extract domain from feature env URL for subtitle
              let featureEnvDomain = '';
              if (featureEnv) {
                try {
                  const urlObj = new URL(featureEnv);
                  featureEnvDomain = urlObj.hostname;
                } catch (e) {
                  // If it's not a valid URL, use as is
                  featureEnvDomain = featureEnv;
                }
              }
            
              console.log('='.repeat(50));
              console.log('📋 EXTRACTED INFORMATION');
              console.log('='.repeat(50));
              console.log(`Issue URL: ${issueUrl}`);
              console.log(`Title: ${issueTitle}`);
              console.log(`Number: #${issueNumber}`);
              console.log(`Feature env: ${featureEnv}`);
              console.log(`Feature env domain: ${featureEnvDomain}`);
            
              // Set outputs
              core.setOutput('issue_url', issueUrl);
              core.setOutput('issue_title', issueTitle);
              core.setOutput('issue_number', issueNumber);
              core.setOutput('feature_env', featureEnv);
              core.setOutput('feature_env_domain', featureEnvDomain);
            
              // Validate required fields
              if (!issueUrl) {
                core.warning('No Issue URL found');
              }
              if (!featureEnv) {
                core.warning('No Feature env value found');
              }
            
            } catch (error) {
              core.setFailed(`Error fetching information: ${error.message}`);
              console.error('Full error:', error);
            }

      - name: Send to Microsoft Teams
        if: success()
        run: |
          WEBHOOK_URL="${{ secrets.TEAMS_WEBHOOK_PRODUCT_TESTING_URL }}"
          
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ No Teams webhook URL found in secrets"
            exit 1
          fi
          
          # Get outputs from previous step
          ISSUE_URL="${{ steps.get-info.outputs.issue_url }}"
          ISSUE_TITLE="${{ steps.get-info.outputs.issue_title }}"
          ISSUE_NUMBER="${{ steps.get-info.outputs.issue_number }}"
          FEATURE_ENV="${{ steps.get-info.outputs.feature_env }}"
          FEATURE_ENV_DOMAIN="${{ steps.get-info.outputs.feature_env_domain }}"
          
          # Create the Teams message card
          cat > teams-message.json << EOF
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "00B894",
            "summary": "${ISSUE_TITLE} - Ready for Testing",
            "title": "🚀 ${ISSUE_TITLE}",
            "sections": [{
              "activityTitle": "Environment Ready for Testing",
              "text": "The feature environment is now deployed and ready for testing.",
              "facts": [
                {
                  "name": "Feature env",
                  "value": "[${FEATURE_ENV}](${FEATURE_ENV})"
                },
                {
                  "name": "GitHub Issue",
                  "value": "[Issue #${ISSUE_NUMBER}](${ISSUE_URL})"
                }
              ],
              "markdown": true
            }]
          }
          EOF
          
          # Send to Teams
          HTTP_RESPONSE=$(curl -H "Content-Type: application/json" \
            -X POST "$WEBHOOK_URL" \
            -d @teams-message.json \
            -s -o /dev/null -w "%{http_code}")
          
          if [ "$HTTP_RESPONSE" -eq "200" ] || [ "$HTTP_RESPONSE" -eq "1" ]; then
            echo "✅ Teams notification sent successfully"
          else
            echo "❌ Failed to send Teams notification (HTTP $HTTP_RESPONSE)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Notification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.get-info.outputs.issue_url }}" != "" ]; then
            echo "✅ **Successfully extracted information:**" >> $GITHUB_STEP_SUMMARY
            echo "- Title: ${{ steps.get-info.outputs.issue_title }}" >> $GITHUB_STEP_SUMMARY
            echo "- Issue Number: #${{ steps.get-info.outputs.issue_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- Feature Environment: ${{ steps.get-info.outputs.feature_env }}" >> $GITHUB_STEP_SUMMARY
            echo "- Teams notification sent" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Failed to extract information from node ID**" >> $GITHUB_STEP_SUMMARY
          fi

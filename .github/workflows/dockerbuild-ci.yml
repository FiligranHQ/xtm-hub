  push-prod-images:
    needs:
      - build-docker-images
      - run-e2e-tests
      - run-front-unit-tests
      - run-api-unit-tests
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.run-e2e-tests.result == 'success')
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and retag images
        run: |
          docker pull filigran/${{ matrix.image }}:${{ needs.build-docker-images.outputs.docker-tags }}

          docker tag filigran/${{ matrix.image }}:${{ needs.build-docker-images.outputs.docker-tags }} \
                     filigran/${{ matrix.image }}-prod:${{ needs.build-docker-images.outputs.docker-tags }}

          docker push filigran/${{ matrix.image }}-prod:${{ needs.build-docker-images.outputs.docker-tags }}
  deploy:
    needs: push-prod-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.push-prod-images.result == 'success')
    steps:
      - name: Install AWX cli
        run: pip install awxkit
      - name: Deploy on Production
        if: contains(github.ref, 'refs/tags/')
        run: |
          export VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-production \
            --extra_vars "{\"env\":\"Production\",\"xtmhub_version\":\"$VERSION\"}"
      - name: Deploy on Staging
        if: github.ref == 'refs/heads/main'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Staging"}'
      - name: Deploy on Development
        if: github.ref == 'refs/heads/development'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Development"}'
      - name: Deploy on Prerelease
        if: github.ref == 'refs/heads/development'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Prerelease"}'

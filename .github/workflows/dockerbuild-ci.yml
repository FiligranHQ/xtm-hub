name: Run XTM Hub CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "development"
    paths:
      - "apps/portal-api/**"
      - "apps/portal-front/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "development"
    paths:
      - "apps/portal-api/**"
      - "apps/portal-front/**"
      - "apps/portal-e2e-tests/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      has-api-changes: ${{ steps.check-changes.outputs.api }}
      has-front-changes: ${{ steps.check-changes.outputs.front }}
      has-e2e-changes: ${{ steps.check-changes.outputs.e2e }}
      base-sha: ${{ steps.setSHAs.outputs.base }}
      head-sha: ${{ steps.setSHAs.outputs.head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive appropriate SHAs for base and head
        id: setSHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'development'
      - run: corepack enable && corepack prepare yarn@3.8.7
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Check what changed
        id: check-changes
        run: |
          AFFECTED=$(yarn dlx nx show projects --affected --base=${{ steps.setSHAs.outputs.base }} --head=${{ steps.setSHAs.outputs.head }})
          
          echo "Affected projects:"
          echo "$AFFECTED"
          
          if grep -q "portal-api" <<< "$AFFECTED"; then
            echo "api=true" >> $GITHUB_OUTPUT
          else
            echo "api=false" >> $GITHUB_OUTPUT
          fi
          
          if grep -q "portal-front" <<< "$AFFECTED"; then
            echo "front=true" >> $GITHUB_OUTPUT
          else
            echo "front=false" >> $GITHUB_OUTPUT
          fi
          
          if grep -q "portal-e2e-tests" <<< "$AFFECTED"; then
            echo "e2e=true" >> $GITHUB_OUTPUT
          else
            echo "e2e=false" >> $GITHUB_OUTPUT
          fi

  prepare-build:
    runs-on: ubuntu-latest
    outputs:
      docker-tag: ${{ steps.generate-tag.outputs.tag }}
      cache-tag: ${{ steps.generate-tag.outputs.cache-tag }}
    steps:
      - name: Generate unique tag for this run
        id: generate-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.number }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="main"
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            TAG="development"
          else
            TAG="test-${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CACHE_TAG="pr-cache"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            CACHE_TAG="main-cache"
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            CACHE_TAG="dev-cache"
          else
            CACHE_TAG="test-cache"
          fi
          echo "cache-tag=$CACHE_TAG" >> $GITHUB_OUTPUT

  build-test-images:
    needs: [determine-changes, prepare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: portal-front
            dockerfile: apps/portal-front/Dockerfile
          - image: portal-api
            dockerfile: apps/portal-api/Dockerfile
          - image: portal-e2e-tests
            dockerfile: apps/portal-e2e-tests/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy migrations for e2e tests
        run: |
          cp -r ./apps/portal-api/src/migrations ./apps/portal-e2e-tests/migrations
          cp -r ./apps/portal-api/tests/seeds ./apps/portal-e2e-tests/seeds

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            filigran/${{ matrix.image }}:${{ needs.prepare-build.outputs.docker-tag }}
            filigran/${{ matrix.image }}:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }}
          build-args: |
            APP_VERSION=0.0.0-e2e
          cache-from: |
            type=registry,ref=filigran/${{ matrix.image }}:${{ needs.prepare-build.outputs.cache-tag }}
            type=registry,ref=filigran/${{ matrix.image }}:main
            type=registry,ref=filigran/${{ matrix.image }}:development
          cache-to: type=registry,ref=filigran/${{ matrix.image }}:${{ needs.prepare-build.outputs.cache-tag }},mode=max

  run-e2e-tests:
    needs: [ build-test-images, prepare-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull pre-built images
        run: |
          docker pull filigran/portal-front:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }} &
          docker pull filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }} &
          docker pull filigran/portal-e2e-tests:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }} &
          wait

          docker tag filigran/portal-front:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }} filigran/portal-front:${{ needs.prepare-build.outputs.docker-tag }}
          docker tag filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }} filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}
          docker tag filigran/portal-e2e-tests:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }} filigran/portal-e2e-tests:${{ needs.prepare-build.outputs.docker-tag }}

      - name: Launch docker compose
        run: |
          mkdir -p ctrf
          export IMAGE_TAGS="${{ needs.prepare-build.outputs.docker-tag }}" \
           TEAMS_WEBHOOK_E2E="${{ secrets.TEAMS_WEBHOOK_E2E }}" \
           GITHUB_PR_TITLE="${{ github.event.pull_request.title }}" \
           GITHUB_PR_NUMBER="${{ github.event.pull_request.number }}" \
           GITHUB_RUN_ID="${{ github.run_id }}"

          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml run portal-e2e-tests || TEST_EXIT_CODE=$?
          CONTAINER_ID=$(docker ps -a --filter "name=portal-e2e-tests-run" --format "{{.ID}}" | head -1)
          docker cp $CONTAINER_ID:/app/apps/portal-e2e-tests/ctrf/. ./ctrf/
          exit ${TEST_EXIT_CODE:-0}
  

  run-api-unit-tests:
    needs:  [build-test-images, prepare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    if: contains(github.ref , 'refs/tags/') == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull pre-built image
        run: |
          docker pull filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }}
          docker tag filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }} filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}

      - name: Launch docker compose
        run: |
          mkdir -p coverage
          export IMAGE_TAGS=${{ needs.prepare-build.outputs.docker-tag }}
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml run portal-api-test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  run-front-unit-tests:
    needs: build-test-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    if: contains(github.ref , 'refs/tags/') == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install docker
        uses: docker/setup-docker-action@v4
      - name: Launch docker compose
        run: |
          export IMAGE_TAGS=${{ needs.build-images-tests.outputs.docker-tags }}
          mkdir -p coverage
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml run portal-front-test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  deploy-feature-branch:
    needs: build-test-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'needs feature env')
    steps:
      - name: Install AWX cli
        run: pip install awxkit

      - name: Deploy
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub feature branch for testing' \
            --inventory eu-west-staging \
            --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"pr-${{ github.event.number }}\",\"xtmhub_node_env\":\"development\"}"
  delete-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Install AWX cli
        run: pip install awxkit

      - name: Delete
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Delete XTM Hub feature branch for testing' \
            --inventory eu-west-staging \
            --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"pr-${{ github.event.pull_request.number }}\"}"
  build-images-prod:
    needs:
      - run-e2e-tests
      - run-front-unit-tests
      - run-api-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: portal-front
            dockerfile: apps/portal-front/Dockerfile
          - image: portal-api
            dockerfile: apps/portal-api/Dockerfile
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.run-e2e-tests.result == 'success') &&
      (needs.run-front-unit-tests.result == 'skipped' || needs.run-front-unit-tests.result == 'success') &&
      (needs.run-api-unit-tests.result == 'skipped' || needs.run-api-unit-tests.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta deps
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: filigran/${{ matrix.image }}-prod
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ contains(github.ref, 'refs/tags/') && 'latest' }}
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "VERSION=staging-${GITHUB_SHA::8}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "VERSION=dev-${GITHUB_SHA::8}" >> $GITHUB_ENV
          else
            echo "VERSION=local-${GITHUB_SHA::8}" >> $GITHUB_ENV
          fi
      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=filigran/${{ matrix.image }}:main
            type=registry,ref=filigran/${{ matrix.image }}:development
            type=registry,ref=filigran/${{ matrix.image }}:latest
            type=registry,ref=filigran/${{ matrix.image }}:${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
  deploy:
    needs: build-images-prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-images-prod.result == 'success')
    steps:
      - name: Install AWX cli
        run: pip install awxkit
      - name: Deploy on Production
        if: contains(github.ref, 'refs/tags/')
        run: |
          export VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-production \
            --extra_vars "{\"env\":\"Production\",\"xtmhub_version\":\"$VERSION\"}"
      - name: Deploy on Staging
        if: github.ref == 'refs/heads/main'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Staging"}'
      - name: Deploy on Development
        if: github.ref == 'refs/heads/development'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Development"}'
      - name: Deploy on Prerelease
        if: github.ref == 'refs/heads/development'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Prerelease"}'
name: Run XTM Hub CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "development"
    paths:
      - "apps/portal-api/**"
      - "apps/portal-front/**"
      - "apps/portal-e2e-tests/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "development"
    paths:
      - "apps/portal-api/**"
      - "apps/portal-front/**"
      - "apps/portal-e2e-tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-apps:
    runs-on: ubuntu-latest
    container: node:24.8-alpine3.22
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build dep
        run: apk add --no-cache docker-cli git python3 make g++ libc6-compat tar
      - name: Corepack Enable
        run: corepack enable
      - name: Cache Next and Yarn
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/apps/portal-front/.next/cache
            ${{ github.workspace }}/.yarn
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push portal image
        run: |
          yarn install --immutable
          cd apps/portal-front
          yarn build 
          ls -la
          cd ../portal-api 
          yarn build
      - name: Upload artifact front
        uses: actions/upload-artifact@v4
        with:
          name: build-context-front-${{ github.event.pull_request.number || github.ref }}
          path: |
            apps/portal-front/.next
          include-hidden-files: true
          overwrite: true
          retention-days: 3
          if-no-files-found: error
      - name: Upload artifact dist api
        uses: actions/upload-artifact@v4
        with:
          name: build-context-api-dist-${{ github.event.pull_request.number || github.ref }}
          path: apps/portal-api/dist
          overwrite: true
          retention-days: 3
          if-no-files-found: error
      - name: Upload artifact node_modules api
        uses: actions/upload-artifact@v4
        with:
          name: build-context-api-node_modules-${{ github.event.pull_request.number || github.ref }}
          path: node_modules
          overwrite: true
          retention-days: 3
          if-no-files-found: error
      - name: Upload artifact config directory
        uses: actions/upload-artifact@v4
        with:
          name: build-context-api-config-${{ github.event.pull_request.number || github.ref }}
          path: apps/portal-api/config
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  run-api-tests:
    runs-on: ubuntu-latest
    needs: build-apps
    container: node:24.8-alpine3.22
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal-password
          POSTGRES_DB: test_database
          PGDATA: /data/postgres
        options: >-
          --health-cmd "pg_isready -d test_database"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
        env:
          discovery.type: single-node
          xpack.ml.enabled: false
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms256m -Xmx256m
        options: >-
          --health-cmd "curl --silent --fail localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2025-06-13T11-33-47Z
        env:
          MINIO_ROOT_USER: portal
          MINIO_ROOT_PASSWORD: changeme
    strategy:
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
#      - name: Install build dep
#        run: apk add --no-cache docker docker-cli docker-cli-compose
#      - name: Launch docker compose for services minio, postgres and elastic
#        run: |
#          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml up -d
      - name: Download all artifacts for front
        uses: actions/download-artifact@v5
        with:
          pattern: build-context-front*
          path: apps/portal-front/.next
      - name: Download dist artifacts for api
        uses: actions/download-artifact@v5
        with:
          pattern: build-context-api-dist*
          path: apps/portal-api/dist
          merge-multiple: true
      - name: Download config artifacts for api
        uses: actions/download-artifact@v5
        with:
          pattern: build-context-api-config*
          path: apps/portal-api/dist/config
          merge-multiple: true
      - name: Download node_modules artifacts for api
        uses: actions/download-artifact@v5
        with:
          pattern: build-context-api-node_modules*
          path: node_modules
          merge-multiple: true
      - name: List downloaded artifacts
        run: |
          echo "=== Structure des artifacts téléchargés ==="
          cd apps
          ls -la
          echo "=== portal-front ==="
          cd portal-front
          ls -la
          echo "=== FRONT .next==="
          ls -la .next
          echo "=== API==="
          cd ../..
          ls -la apps/portal-api
          echo "=== API dist==="
          ls -la apps/portal-api/dist
          echo "=== API config==="
          ls -la apps/portal-api/dist/config
      - name: Install dependencies for health checks
        run: |
          apk add --no-cache curl postgresql-client

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h postgres -p 5432 -U portal; do
            echo "PostgreSQL is not ready yet..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
          
          echo "Waiting for Elasticsearch..."
          until curl -s http://elasticsearch:9200/_cluster/health?wait_for_status=yellow; do
            echo "Elasticsearch is not ready yet..."
            sleep 2
          done
          echo "Elasticsearch is ready!"
          
          echo "Waiting for Minio..."
          for i in {1..30}; do
            if curl -s -f http://minio:9000/minio/health/live; then
              echo "Minio is ready!"
              break
            fi
            echo "Minio is not ready yet..."
            sleep 2
          done
      - name: Je le démarre pour voir
        run: |
            export DATABASE_HOST=postgres
            export DATABASE_PORT=5432
            export DATABASE_USER=portal
            export DATABASE_BASE=test_database
            export DATABASE_PASSWORD=portal-password
            export ADMIN_EMAIL=admin@filigran.io
            export ADMIN_PASSWORD=admin
            export DATA_SEEDING=true
            export MINIO_BUCKET_NAME=xtmhubbucket
            export MINIO_ENDPOINT=minio
            export MINIO_PORT=9000
            export MINIO_ACCESS_KEY=portal
            export MINIO_SECRET_KEY=changeme
            export MINIO_USE_SSL=false
            export NODE_ENV=development
            export VITEST_MODE=true
            export START_DEV_SERVER=true
            export ELASTIC_HOST=elasticsearch
            export ELASTIC_PORT=9200
            export BASE_URL_FRONT=http://portal-front:3000
            cd apps/portal-api/dist
            node index.js

name: Run XTM Hub CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "development"
    paths:
      - "apps/portal-api/**"
      - "apps/portal-front/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "development"
    paths:
      - "apps/portal-api/**"
      - "apps/portal-front/**"
      - "apps/portal-e2e-tests/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  POSTGRES_VERSION: "17.2"
  MINIO_VERSION: "RELEASE.2024-08-03T04-33-23Z"
  ELASTIC_VERSION: "8.18.3"
jobs:
  prepare-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      docker-tag: ${{ steps.generate-tag.outputs.tag }}
      cache-tag: ${{ steps.generate-tag.outputs.cache-tag }}
    steps:
      - name: Generate unique tag for this run
        id: generate-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.number }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="main"
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            TAG="development"
          else
            TAG="test-${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CACHE_TAG="pr-cache"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            CACHE_TAG="main-cache"
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            CACHE_TAG="dev-cache"
          else
            CACHE_TAG="test-cache"
          fi
          echo "cache-tag=$CACHE_TAG" >> $GITHUB_OUTPUT

  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      has-api-changes: ${{ steps.check-changes.outputs.api }}
      has-front-changes: ${{ steps.check-changes.outputs.front }}
      has-e2e-changes: ${{ steps.check-changes.outputs.e2e }}
      base-sha: ${{ steps.setSHAs.outputs.base }}
      head-sha: ${{ steps.setSHAs.outputs.head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive appropriate SHAs for base and head
        id: setSHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'development'
      - run: corepack enable && corepack prepare yarn@3.8.7
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Check what changed
        id: check-changes
        run: |
          AFFECTED=$(yarn dlx nx show projects --affected --base=${{ steps.setSHAs.outputs.base }} --head=${{ steps.setSHAs.outputs.head }})
          echo "Affected projects:"
          echo "$AFFECTED"
          if grep -q "portal-api" <<< "$AFFECTED"; then
            echo "api=true" >> $GITHUB_OUTPUT
          else
            echo "api=false" >> $GITHUB_OUTPUT
          fi
          if grep -q "portal-front" <<< "$AFFECTED"; then
            echo "front=true" >> $GITHUB_OUTPUT
          else
            echo "front=false" >> $GITHUB_OUTPUT
          fi
          if grep -q "portal-e2e-tests" <<< "$AFFECTED"; then
            echo "e2e=true" >> $GITHUB_OUTPUT
          else
            echo "e2e=false" >> $GITHUB_OUTPUT
          fi

  pull-external-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and push external images to your registry
        run: |
          echo "📦 Pre-pulling external images to speed up tests..."
          
          UNIQUE_TAG="${{ github.run_id }}-${{ github.run_attempt }}"
          
          docker pull postgres:${{ env.POSTGRES_VERSION }} &
          PG_PID=$!
          docker pull minio/minio:${{ env.MINIO_VERSION }} &
          MINIO_PID=$!
          docker pull docker.elastic.co/elasticsearch/elasticsearch:${{ env.ELASTIC_VERSION }} &
          ELASTIC_PID=$!
          
          wait $PG_PID $MINIO_PID $ELASTIC_PID
          
          docker tag postgres:${{ env.POSTGRES_VERSION }} filigran/ci-postgres:$UNIQUE_TAG
          docker tag minio/minio:${{ env.MINIO_VERSION }} filigran/ci-minio:$UNIQUE_TAG
          docker tag docker.elastic.co/elasticsearch/elasticsearch:${{ env.ELASTIC_VERSION }} filigran/ci-elastic:$UNIQUE_TAG
          
          docker push filigran/ci-postgres:$UNIQUE_TAG &
          docker push filigran/ci-minio:$UNIQUE_TAG &
          docker push filigran/ci-elastic:$UNIQUE_TAG &
          wait
          
          echo "✅ External images ready in your registry with tag: $UNIQUE_TAG"
          echo "unique-tag=$UNIQUE_TAG" >> $GITHUB_OUTPUT
  build-test-images:
    needs: [determine-changes, prepare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: portal-front
            dockerfile: apps/portal-front/Dockerfile
          - image: portal-api
            dockerfile: apps/portal-api/Dockerfile
          - image: portal-e2e-tests
            dockerfile: apps/portal-e2e-tests/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy migrations for e2e tests
        if: matrix.image == 'portal-e2e-tests'
        run: |
          cp -r ./apps/portal-api/src/migrations ./apps/portal-e2e-tests/migrations || true
          cp -r ./apps/portal-api/tests/seeds ./apps/portal-e2e-tests/seeds || true
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            filigran/${{ matrix.image }}:${{ needs.prepare-build.outputs.docker-tag }}
            filigran/${{ matrix.image }}:${{ needs.prepare-build.outputs.docker-tag }}-${{ github.sha }}
          build-args: |
            APP_VERSION=0.0.0-e2e
          cache-from: |
            type=registry,ref=filigran/${{ matrix.image }}:cache-${{ needs.prepare-build.outputs.docker-tag }}
            type=registry,ref=filigran/${{ matrix.image }}:main
            type=registry,ref=filigran/${{ matrix.image }}:development
          cache-to: |
            type=registry,ref=filigran/${{ matrix.image }}:cache-${{ needs.prepare-build.outputs.docker-tag }},mode=max

  # JOB UNIQUE AVEC MATRICE POUR TOUS LES TESTS
  run-all-tests:
    needs: [build-test-images, prepare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: contains(github.ref, 'refs/tags/') == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      fail-fast: true
      matrix:
        test-type: [e2e, api-unit, front-unit]
        include:
          - test-type: e2e
            needs-frontend: true
            timeout: 10
          - test-type: api-unit
            needs-frontend: false
            timeout: 5
          - test-type: front-unit
            needs-frontend: false
            timeout: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine required images
        id: images
        run: |
          echo "required to test: ${{ matrix.test-type }}"
          
          IMAGES="postgres:${{ env.POSTGRES_VERSION }} minio/minio:${{ env.MINIO_VERSION }} docker.elastic.co/elasticsearch/elasticsearch:${{ env.ELASTIC_VERSION }}"
          
          case "${{ matrix.test-type }}" in
            e2e)
              IMAGES="$IMAGES filigran/portal-front:${{ needs.prepare-build.outputs.docker-tag }}"
              IMAGES="$IMAGES filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}"
              IMAGES="$IMAGES filigran/portal-e2e-tests:${{ needs.prepare-build.outputs.docker-tag }}"
              ;;
            api-unit)
              IMAGES="$IMAGES filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}"
              ;;
            front-unit)
              IMAGES="filigran/portal-front:${{ needs.prepare-build.outputs.docker-tag }}"
              ;;
          esac
          
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

      - name: Pull required images in parallel
        run: |
          echo "Pulling images for ${{ matrix.test-type }} tests..."
          
          pull_with_retry() {
            local image=$1
            local max_attempts=3
            for attempt in $(seq 1 $max_attempts); do
              if docker pull "$image"; then
                echo "Pulled $image"
                return 0
              fi
              echo "Attempt $attempt/$max_attempts failed for $image"
              [ $attempt -lt $max_attempts ] && sleep 2
            done
            return 1
          }
          
          for image in ${{ steps.images.outputs.images }}; do
            pull_with_retry "$image" &
          done
          
          wait

      - name: Start required services
        run: |
          echo "Starting services for ${{ matrix.test-type }} tests..."
          
          # Démarrer PostgreSQL et MinIO 
          if [[ "${{ matrix.test-type }}" != "front-unit" ]]; then
            docker run -d \
              --name portal-postgres \
              --health-cmd "pg_isready -U portal" \
              --health-interval 2s \
              --health-timeout 3s \
              --health-retries 30 \
              -e POSTGRES_USER=portal \
              -e POSTGRES_PASSWORD=portal-password \
              -e POSTGRES_DB=$([[ "${{ matrix.test-type }}" == "e2e" ]] && echo "test_database" || echo "postgres") \
              postgres:${{ env.POSTGRES_VERSION }}
          
            docker run -d \
              --name portal-minio \
              --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1" \
              --health-interval 2s \
              --health-timeout 3s \
              --health-retries 30 \
              -e MINIO_ROOT_USER=$([[ "${{ matrix.test-type }}" == "e2e" ]] && echo "portal" || echo "minio") \
              -e MINIO_ROOT_PASSWORD=$([[ "${{ matrix.test-type }}" == "e2e" ]] && echo "changeme" || echo "password") \
              minio/minio:${{ env.MINIO_VERSION }} server /data --console-address ":9001"
          
            docker run -d \
              --name portal-elasticsearch \
              --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1" \
              --health-interval 5s \
              --health-timeout 5s \
              --health-retries 30 \
              -e discovery.type=single-node \
              -e xpack.security.enabled=false \
              -e xpack.ml.enabled=false \
              -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
              docker.elastic.co/elasticsearch/elasticsearch:${{ env.ELASTIC_VERSION }}
            for service in portal-postgres portal-minio portal-elasticsearch; do
              echo "Waiting for $service..."
              timeout 60s bash -c "until docker inspect $service --format='{{json .State.Health.Status}}' 2>/dev/null | grep -q '\"healthy\"'; do sleep 2; done" || true
              echo "$service is ready"
            done
          fi
          
          if [[ "${{ matrix.test-type }}" == "e2e" ]]; then          
            docker run -d \
              --name portal-api \
              --health-cmd "wget -qO- http://localhost:4001/health || exit 1" \
              --health-interval 3s \
              --health-timeout 3s \
              --health-retries 20 \
              -p 4001:4001 \
              -e DATABASE_HOST=portal-postgres \
              -e DATABASE_PORT=5432 \
              -e DATABASE_USER=portal \
              -e DATABASE_BASE=test_database \
              -e DATABASE_PASSWORD=portal-password \
              -e ADMIN_EMAIL=admin@filigran.io \
              -e ADMIN_PASSWORD=admin \
              -e DATA_SEEDING=true \
              -e MINIO_BUCKET_NAME=xtmhubbucket \
              -e MINIO_ENDPOINT=portal-minio \
              -e MINIO_PORT=9000 \
              -e MINIO_ACCESS_KEY=portal \
              -e MINIO_SECRET_KEY=changeme \
              -e MINIO_USE_SSL=false \
              -e NODE_ENV=development \
              -e VITEST_MODE=true \
              -e START_DEV_SERVER=true \
              -e ELASTIC_HOST=portal-elasticsearch \
              -e ELASTIC_PORT=9200 \
              -e BASE_URL_FRONT=http://portal-front:3000 \
              filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }}
          
            echo "Waiting for API..."
            timeout 60s bash -c "until docker inspect portal-api --format='{{json .State.Health.Status}}' 2>/dev/null | grep -q '\"healthy\"'; do sleep 2; done"
            echo "API is ready"
          
            docker run -d \
              --name portal-front \
              --health-cmd "wget -qO- http://localhost:3000/health || exit 1" \
              --health-interval 3s \
              --health-timeout 3s \
              --health-retries 20 \
              -p 3000:3000 \
              -e SERVER_HTTP_API=http://portal-api:4001 \
              filigran/portal-front:${{ needs.prepare-build.outputs.docker-tag }}
          
            echo "Waiting for Frontend..."
            timeout 60s bash -c "until docker inspect portal-front --format='{{json .State.Health.Status}}' 2>/dev/null | grep -q '\"healthy\"'; do sleep 2; done"
            echo "Frontend is ready"
          fi
          
          echo "All required services are running for ${{ matrix.test-type }}"
          docker ps

      - name: Run tests
        run: |
          echo "Running ${{ matrix.test-type }} tests..."
          mkdir -p test-results
          
          case "${{ matrix.test-type }}" in
            e2e)
              mkdir -p ctrf
              docker run \
                --name portal-e2e-tests \
                -e E2E_BASE_URL=http://portal-front:3000 \
                -e E2E_API_URL=http://portal-api:4001 \
                -e POSTGRES_USER=portal \
                -e DATABASE_HOST=portal-postgres \
                -e POSTGRES_DB=test_database \
                -e POSTGRES_PASSWORD=portal-password \
                -e DATABASE_PORT=5432 \
                -e TEAMS_WEBHOOK_E2E="${{ secrets.TEAMS_WEBHOOK_E2E }}" \
                -e MIGRATIONS_PATH=./migrations \
                -e SEEDS_PATH=./seeds \
                -e GITHUB_PR_NUMBER="${{ github.event.pull_request.number }}" \
                -e GITHUB_PR_TITLE="${{ github.event.pull_request.title }}" \
                -e GITHUB_RUN_ID="${{ github.run_id }}" \
                -v $(pwd)/ctrf:/app/apps/portal-e2e-tests/ctrf \
                filigran/portal-e2e-tests:${{ needs.prepare-build.outputs.docker-tag }} || TEST_EXIT_CODE=$?
          
              if [ -d ctrf ]; then
                cp -r ctrf/* test-results/ 2>/dev/null || true
              fi
              ;;
          
            api-unit)
              mkdir -p coverage
              docker run \
                --rm \
                --name portal-api-test \
                -e DATABASE_HOST=portal-postgres \
                -e DATABASE_PORT=5432 \
                -e DATABASE_USER=portal \
                -e DATABASE_BASE=postgres \
                -e DATABASE_PASSWORD=portal-password \
                -e ADMIN_EMAIL=admin@filigran.io \
                -e ADMIN_PASSWORD=admin \
                -e NODE_ENV=test \
                -e MINIO_BUCKET_NAME=xtmhubbucket \
                -e MINIO_ENDPOINT=portal-minio \
                -e MINIO_PORT=9000 \
                -e MINIO_ACCESS_KEY=minio \
                -e MINIO_SECRET_KEY=password \
                -e MINIO_USE_SSL=false \
                -v $(pwd)/coverage:/app/apps/portal-api/coverage \
                filigran/portal-api:${{ needs.prepare-build.outputs.docker-tag }} \
                npm test || TEST_EXIT_CODE=$?
          
              if [ -d coverage ]; then
                cp -r coverage/* test-results/ 2>/dev/null || true
              fi
              ;;
          
            front-unit)
              mkdir -p coverage
              docker run \
                --rm \
                --name portal-front-test \
                -e SERVER_HTTP_API=http://localhost:4001 \
                -e NODE_ENV=test \
                -v $(pwd)/coverage:/app/apps/portal-front/coverage \
                filigran/portal-front:${{ needs.prepare-build.outputs.docker-tag }} \
                npm test || TEST_EXIT_CODE=$?
          
              if [ -d coverage ]; then
                cp -r coverage/* test-results/ 2>/dev/null || true
              fi
              ;;
          esac
          
          exit ${TEST_EXIT_CODE:-0}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test-type }}-results
          path: |
            test-results/
            ctrf/
            coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.test-type != 'e2e' && always()
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          name: ${{ matrix.test-type }}

      - name: Show logs on failure
        if: failure()
        run: |
          awx --conf.host https://awx.filigran.io \
          --conf.token ${{ secrets.AWX_TOKEN }} \
          -f human job_templates launch 'Deploy XTM Hub feature branch for testing' \
          --inventory eu-west-staging \
          --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"pr-${{ github.event.number }}\",\"xtmhub_node_env\":\"development\"}"
  deploy-feature-branch:
    needs: run-all-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'pull_request' &&	
      contains(github.event.pull_request.labels.*.name, 'needs feature env')
    steps:
    - name: Install AWX cli
      run: pip install awxkit
    - name: Deploy
      run: |
        awx --conf.host https://awx.filigran.io \
          --conf.token ${{ secrets.AWX_TOKEN }} \
          -f human job_templates launch 'Deploy XTM Hub feature branch for testing' \
          --inventory eu-west-staging \
          --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"pr-${{ github.event.number }}\",\"xtmhub_node_env\":\"development\"}"

  delete-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Install AWX cli
        run: pip install awxkit

      - name: Delete
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Delete XTM Hub feature branch for testing' \
            --inventory eu-west-staging \
            --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"pr-${{ github.event.pull_request.number }}\"}"

  build-images-prod:
    needs:
      - run-all-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: portal-front
            dockerfile: apps/portal-front/Dockerfile
          - image: portal-api
            dockerfile: apps/portal-api/Dockerfile
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.run-all-tests.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta deps
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: filigran/${{ matrix.image }}-prod
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ contains(github.ref, 'refs/tags/') && 'latest' }}
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "VERSION=staging-${GITHUB_SHA::8}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "VERSION=dev-${GITHUB_SHA::8}" >> $GITHUB_ENV
          else
            echo "VERSION=local-${GITHUB_SHA::8}" >> $GITHUB_ENV
          fi
      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=filigran/${{ matrix.image }}:main
            type=registry,ref=filigran/${{ matrix.image }}:development
            type=registry,ref=filigran/${{ matrix.image }}:latest
            type=registry,ref=filigran/${{ matrix.image }}:${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
  deploy:
    needs: build-images-prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-images-prod.result == 'success')
    steps:
      - name: Install AWX cli
        run: pip install awxkit
      - name: Deploy on Production
        if: contains(github.ref, 'refs/tags/')
        run: |
          export VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-production \
            --extra_vars "{\"env\":\"Production\",\"xtmhub_version\":\"$VERSION\"}"
      - name: Deploy on Staging
        if: github.ref == 'refs/heads/main'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Staging"}'
      - name: Deploy on Development
        if: github.ref == 'refs/heads/development'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Development"}'
      - name: Deploy on Prerelease
        if: github.ref == 'refs/heads/development'
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Deploy XTM Hub' \
            --inventory eu-west-staging \
            --extra_vars '{"env":"Prerelease"}'
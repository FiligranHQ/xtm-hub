services:
  portal-front:
    container_name: portal-front
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: filigran/portal-front:${IMAGE_TAGS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      portal-api:
        condition: service_healthy
    environment:
      - SERVER_HTTP_API=http://localhost:4001

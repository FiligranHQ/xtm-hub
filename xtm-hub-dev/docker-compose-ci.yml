  portal-api:
    container_name: portal-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: filigran/portal-api:${IMAGE_TAGS}
    network_mode: "host"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - DATABASE_HOST=localhost
      - DATABASE_PORT=5432
      - DATABASE_USER=portal
      - DATABASE_BASE=test_database
      - DATABASE_PASSWORD=portal-password
      - ADMIN_EMAIL=admin@filigran.io
      - ADMIN_PASSWORD=admin
      - DATA_SEEDING=true
      - MINIO_BUCKET_NAME=xtmhubbucket
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=portal
      - MINIO_SECRET_KEY=changeme
      - MINIO_USE_SSL=false
      - NODE_ENV=development
      - VITEST_MODE=true
      - START_DEV_SERVER=true
      - ELASTIC_HOST=localhost
      - ELASTIC_PORT=9200
      - BASE_URL_FRONT=http://portal-front:3000

  portal-minio:
    container_name: portal-minio
    network_mode: "host"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: "minio/minio:RELEASE.2025-06-13T11-33-47Z"
    environment:
      MINIO_ROOT_USER: portal
      MINIO_ROOT_PASSWORD: changeme
    command: "minio server /data/minio"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  portal-e2e-tests:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: filigran/portal-e2e-tests:${IMAGE_TAGS}
    network_mode: "host"
    depends_on:
      portal-front:
        condition: service_healthy
      portal-api:
        condition: service_healthy
    environment:
      - E2E_BASE_URL=http://portal-front:3000
      - E2E_API_URL=http://portal-api:4001
      - POSTGRES_USER=portal
      - DATABASE_HOST=localhost
      - POSTGRES_DB=test_database
      - POSTGRES_PASSWORD=portal-password
      - DATABASE_PORT=5432
      - TEAMS_WEBHOOK_E2E=${TEAMS_WEBHOOK_E2E}
      - MIGRATIONS_PATH=./migrations
      - SEEDS_PATH=./seeds
      - GITHUB_PR_NUMBER=${GITHUB_PR_NUMBER}
      - GITHUB_PR_TITLE=${GITHUB_PR_TITLE}
      - GITHUB_RUN_ID=${GITHUB_RUN_ID}

services:
  portal-postgres:
    container_name: portal-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:17.2
    environment:
      - POSTGRES_USER=portal
      - POSTGRES_PASSWORD=portal-password
      - POSTGRES_DB=test_database
      - PGDATA=/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "test_database"]
      interval: 10s
      timeout: 5s
      retries: 10

  portal-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
    container_name: portal-elasticsearch
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  portal-minio:
    container_name: portal-minio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: "minio/minio:RELEASE.2025-06-13T11-33-47Z"
    environment:
      MINIO_ROOT_USER: portal
      MINIO_ROOT_PASSWORD: changeme
    command: "minio server /data/minio"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
